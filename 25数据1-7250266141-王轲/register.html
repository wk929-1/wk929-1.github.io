<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册账号</title>
    <style>
    body {
      font-family: "微软雅黑";
      background-color: #f5f7fa;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    /* 注册表单容器（复用登录页结构，仅类名调整） */
    .register-form {
      width: 100%;
      max-width: 400px;
      padding: 30px;
      background-color: #ffffff;
      border-radius: 12px;
    }
    /* 输入框样式（和登录页统一） */
    .register-form input {
      width: 100%;
      padding: 14px 16px;
      margin: 12px 0;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      font-size: 16px;
    }
    .register-form input:focus {
        /*清除元素的默认焦点轮廓线*/
      border-color: blue;
      box-shadow: 0 0 0 3px black;  /*为元素添加一个“外发光”效果*/
    }
    /* 注册按钮（和登录页统一） */
    .register-form button {
      width: 100%;
      padding: 14px;
      margin: 15px 0;
      background-color: linear-gradient(135deg, #007bff, #0056b3);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    .register-form button:hover {
      background-color: blue;
    }
    /* 登录链接（新增，和注册页呼应） */
    .register-form a {
      display: block;
      text-align: center;
      color: #007bff;
      text-decoration: none;
      font-size: 14px;
      margin-top: 10px;
    }
    .register-form a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
    <form class="register-form">
    <input type="text" placeholder="用户名" required>
    <input type="password" placeholder="密码" required>
    <input type="email" placeholder="邮箱" required>
    <button type="submit">注册</button>
    <a href="login.html">已有账号？去登录</a>
  </form>
</body>
</html>
