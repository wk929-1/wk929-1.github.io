<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人博客网页</title>
    <style>
    body {
      background-color: #f5f7fa;
      margin: 0;
      padding: 0;
    }

    /* 登录表单容器：卡片化设计 */
    .login-card {
      background-color: #ffffff;
      border-radius: 12px; /* 更圆润的边角 */
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08); /* 更柔和的阴影 */
      padding: 35px 40px;
    }

    /* 标题：加粗+居中+深灰 */
    .login-title {
      text-align: center;
      font-size: 22px;
      font-weight: 600;
      color: #333333;
    }

    /* 输入框：统一样式+聚焦反馈 */
    .form-input {
      width: 100%;
      padding: 14px 16px;
      margin-bottom: 20px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 15px;
      transition: border-color 0.3s ease;
    }
    .form-input:focus {
      outline: none;
      border-color: #007bff; /* 聚焦时蓝色边框 */
      box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1); /* 轻微光晕提示 */
    }

    /* 登录按钮：渐变+悬停效果 */
    .login-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #007bff, #0056b3); /* 蓝色渐变 */
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 500;
      transition: opacity 0.3s ease;
    }
    .login-btn:hover {
      opacity: 0.9; /* 悬停时略微透明 */
    }

    /* 注册链接：居中+淡蓝 */
    .register-link {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #007bff;
      font-size: 14px;
    }
    .register-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <h2 class="login-title">用户登录</h2>
    <form action="all.html" method="post">
      <input class="form-input" type="text" placeholder="请输入用户名" required>
      <input class="form-input" type="password" placeholder="请输入密码" required>
      <button class="login-btn" type="submit">登录</button>
      <a class="register-link" href="register.html">还没有账号？立即注册</a>
    </form>
  </div>
</body>
</html>
